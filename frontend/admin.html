<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Admin panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="pb-4">

    <nav class="navbar bg-dark sticky-top">
        <div class="container">
            <span class="navbar-brand text-white mb-0 h1"><i class="bi bi-gear"></i> Admin panel</span>
        </div>
    </nav>

    <div class="container pt-3">
        <ul class="nav nav-pills nav-fill mb-3" id="admin-tabs">
            <li class="nav-item"><button class="nav-link" data-tab="books" onclick="goTo('books')">Kitoblar</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="categories" onclick="goTo('categories')">Kategoriya</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="orders" onclick="goTo('orders')">Buyurtma</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="stats" onclick="goTo('stats')">Statistika</button></li>
        </ul>

        <main id="content"></main>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
        <div id="toast" class="toast text-bg-dark" role="alert">
            <div class="toast-body" id="toast-text"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin.js"></script>
</body>
</html>
